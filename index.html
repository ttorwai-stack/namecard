<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2457d6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>디지털 명함</title>
<link rel="stylesheet" href="card.css">
<script src="qrcode.js"></script>
<script src="card.js"></script>
<style>
  :root { --bg:#eef2f7; --card:#fff; --text:#1c2733; --sub:#5b6b7b; --accent:#2457d6; --line:#e3e8ef; --field:#f6f8fb; --warn:#c2410c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10151c; --card:#1a222d; --text:#eef2f7; --sub:#9aa8b8; --accent:#6c97ff; --line:#2a3544; --field:#222c39; --warn:#fb923c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
         min-height:100vh; display:flex; justify-content:center; padding:12px 16px; }
  .card { width:100%; max-width:420px; background:var(--card); border-radius:20px; box-shadow:0 8px 30px rgba(0,0,0,.12); overflow:hidden; align-self:flex-start; }
  .hidden { display:none !important; }
  nav { display:flex; border-bottom:1px solid var(--line); }
  nav button { flex:1; padding:14px 0; background:none; border:0; border-radius:0; color:var(--sub); font-size:14px; font-weight:600; border-bottom:2px solid transparent; }
  nav button.on { color:var(--accent); border-bottom-color:var(--accent); }
  .qrwrap { text-align:center; padding:8px 24px 16px; }
  #qr { display:inline-block; background:#fff; padding:10px; border-radius:12px; border:1px solid var(--line); }
  #qr img { display:block; width:min(190px,26vh); height:min(190px,26vh); image-rendering:pixelated; }
  .hint { font-size:13px; color:var(--sub); margin-top:8px; line-height:1.5; }
  .menu { display:flex; flex-direction:column; gap:10px; margin-top:8px; }
  .menu button { flex:none; text-align:left; padding:16px; }
  .seg { display:inline-flex; border:1.5px solid var(--accent); border-radius:10px; overflow:hidden; margin-bottom:10px; }
  .seg button { flex:none; padding:8px 14px; background:none; color:var(--accent); border-radius:0; font-size:13px; }
  .seg button.on { background:var(--accent); color:#fff; }
  .actions { display:flex; gap:10px; padding:0 24px 16px; flex-wrap:wrap; }
  button { flex:1; padding:14px; border-radius:12px; border:0; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; }
  .primary { background:var(--accent); color:#fff; }
  .ghost { background:transparent; color:var(--accent); border:1.5px solid var(--accent); }
  .danger { background:transparent; color:var(--warn); border:1.5px solid var(--warn); }
  button:disabled { opacity:.5; }
  /* 입력 폼 */
  form, .pane { padding:24px; }
  form h1, .pane h1 { font-size:20px; margin:0 0 4px; }
  form p, .pane p { color:var(--sub); font-size:13px; margin:0 0 16px; line-height:1.5; }
  label { display:block; font-size:13px; color:var(--sub); margin:12px 0 4px; }
  input, textarea { width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--field); color:var(--text); font-size:16px; font-family:inherit; }
  input.fixed { border-color:var(--accent); }
  .two { display:flex; gap:10px; } .two > div { flex:1; }
  form .actions, .pane .actions { padding:20px 0 0; }
  #preview { width:100%; border-radius:12px; margin-bottom:12px; display:block; }
  .msg { font-size:13px; color:var(--sub); margin:10px 0 0; line-height:1.5; }
  .msg:empty { display:none; }
  .msg.err { color:var(--warn); }
  .item { padding:12px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .item b { font-size:16px; } .item small { display:block; color:var(--sub); font-size:13px; margin-top:2px; }
  .search { margin-bottom:8px; }
  a.link { color:var(--accent); font-size:13px; }
</style>
</head>
<body>
<main class="card">

  <nav id="nav">
    <button data-tab="mine" class="on">내 명함</button>
    <button data-tab="scan">스캔</button>
    <button data-tab="lib">보관함</button>
    <button data-tab="info">내 정보</button>
  </nav>

  <!-- 내 명함: 입력 -->
  <form id="mineForm" class="hidden" autocomplete="off">
    <h1>내 명함 만들기</h1>
    <p>입력한 정보는 <b>이 휴대폰의 브라우저에만</b> 저장되며 서버로 전송되지 않습니다.</p>
    <div class="fields"></div>
    <div class="actions">
      <button type="button" class="ghost hidden" id="mineCancel">취소</button>
      <button type="submit" class="primary">저장</button>
    </div>
  </form>

  <!-- 내 명함: 보기 -->
  <section id="mineView" class="hidden">
    <div class="card-render"></div>
    <div class="qrwrap">
      <div class="seg" id="qrMode">
        <button data-m="vcf" class="on">연락처 QR</button>
        <button data-m="link">링크 QR</button>
      </div>
      <div><div id="qr"></div></div>
      <div class="hint" id="qrHint"></div>
    </div>
  </section>

  <!-- 내 정보 관리 -->
  <section id="infoPane" class="pane hidden">
    <h1>내 정보</h1>
    <p>내 명함 화면은 상대에게 보여주는 용도라, 관리 기능은 여기에 모았습니다.</p>
    <div class="menu">
      <button class="primary" id="mineEdit">정보 수정</button>
      <button class="ghost" id="share">링크 공유</button>
      <button class="ghost" id="mineVcf">연락처 파일(.vcf)로 저장</button>
    </div>
    <div class="msg" id="infoMsg"></div>
  </section>

  <!-- 스캔 -->
  <section id="scanPane" class="pane hidden">
    <h1>명함 스캔</h1>
    <p>명함을 촬영하면 글자를 읽어 채워 줍니다. 틀린 곳을 고쳐 저장하면 다음부터 같은 실수를 자동으로 바로잡습니다.</p>
    <input type="file" id="file" accept="image/*" capture="environment" class="hidden">
    <img id="preview" class="hidden" alt="">
    <div class="actions" style="padding-top:0">
      <button class="primary" id="pick">명함 촬영 / 사진 선택</button>
      <button class="ghost" id="manual">직접 입력</button>
    </div>
    <div class="msg" id="scanMsg"></div>
    <form id="scanForm" class="hidden" style="padding:8px 0 0">
      <div class="fields"></div>
      <div class="actions">
        <button type="button" class="danger hidden" id="scanDel">삭제</button>
        <button type="button" class="ghost" id="scanVcf">.vcf로 연락처 저장</button>
        <button type="submit" class="primary">보관함에 저장</button>
      </div>
    </form>
    <p style="margin-top:18px"><a href="#" class="link" id="setOcr">OCR 서버 주소 설정</a></p>
  </section>

  <!-- 보관함 -->
  <section id="libPane" class="pane hidden">
    <h1>받은 명함</h1>
    <input class="search" id="q" placeholder="이름 · 소속 · 전화 검색">
    <div id="list"></div>
    <div class="actions"><button class="ghost" id="exportAll">전체 .vcf로 내보내기</button></div>
    <div class="msg" id="libMsg"></div>
  </section>

</main>

<script>
const $ = id => document.getElementById(id);
const KEY = "namecard.v1", LIB = "namecard.lib.v1", FIX = "namecard.fixes.v1", OCRKEY = "namecard.ocr";
const DEFAULT_OCR_URL = "";   // 배포한 Worker 주소를 넣으면 설정 없이 바로 동작합니다.
const DEFS = [
  ["lastName","성","half"],["firstName","이름","half"],["org","소속"],["dept","부서"],["title","직함"],
  ["phone","휴대폰","tel"],["tel","사무실 전화","tel"],["email","이메일","email"],["url","홈페이지","url"],
  ["address","주소"],["note","메모","area"]
];
if (DEFS.map(d => d[0]).join() !== FIELDS.join()) throw new Error("필드 정의가 card.js와 다릅니다");

const read  = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { alert("이 브라우저에서는 저장할 수 없습니다. (사생활 보호 모드인지 확인해 주세요)"); return false; } };

function fieldsHtml(p) {
  let out = "", i = 0;
  while (i < DEFS.length) {
    const [f, l, t] = DEFS[i];
    if (t === "half") {
      const [f2, l2] = DEFS[i + 1];
      out += `<div class="two"><div><label for="${p}-${f}">${l}</label><input id="${p}-${f}"></div><div><label for="${p}-${f2}">${l2}</label><input id="${p}-${f2}"></div></div>`;
      i += 2; continue;
    }
    out += `<label for="${p}-${f}">${l}</label>` +
      (t === "area" ? `<textarea id="${p}-${f}" rows="2"></textarea>` : `<input id="${p}-${f}"${t ? ` type="${t}"` : ""}${t === "tel" ? ' inputmode="tel"' : ""}>`);
    i++;
  }
  return out;
}
const getForm = p => Object.fromEntries(FIELDS.map(f => [f, $(`${p}-${f}`).value.trim()]));
const setForm = (p, m) => FIELDS.forEach(f => { const e = $(`${p}-${f}`); e.value = (m && m[f]) || ""; e.classList.remove("fixed"); });
document.querySelectorAll("form .fields").forEach(el => el.innerHTML = fieldsHtml(el.closest("form").id === "mineForm" ? "mine" : "scan"));

/* ---------- 탭 ---------- */
function show(ids) {
  ["mineView","mineForm","scanPane","libPane","infoPane"].forEach(id => $(id).classList.toggle("hidden", !ids.includes(id)));
}
function setNav(t) {
  $("nav").classList.remove("hidden");
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
}
function tab(t) {
  setNav(t);
  if (t === "mine") { const m = read(KEY, null); m && m.lastName ? showMine(m) : showMineForm(null); }
  if (t === "scan") show(["scanPane"]);
  if (t === "lib") { show(["libPane"]); renderLib(); }
  if (t === "info") showInfo();
}
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => tab(b.dataset.tab));

/* ---------- 내 명함 ---------- */
let qrMode = "vcf", formFrom = "mine";
function showMineForm(m, from) {
  formFrom = from || "mine";
  setNav(formFrom);
  setForm("mine", m);
  $("mineCancel").classList.toggle("hidden", !m);
  show(["mineForm"]);
}
function drawQr(m) {
  const data = qrMode === "vcf" ? buildVcard(m) : cardLink(m);
  let qr = null;
  try {
    qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
    for (const ec of ["M", "L"]) {               // 링크·내용이 길면 오류정정 수준을 낮춰 재시도
      try { qr = qrcode(0, ec); qr.addData(data); qr.make(); break; } catch (e) { qr = null; }
    }
  } catch (e) {}
  $("qr").innerHTML = qr ? qr.createImgTag(6, 0) : "<div class='hint'>내용이 너무 길어 QR을 만들 수 없습니다. 메모를 줄여 주세요.</div>";
  $("qrHint").textContent = qrMode === "vcf" ? "카메라로 찍으면 연락처 저장 화면이 열립니다" : "찍으면 명함 페이지가 열립니다";
}
function showMine(m) {
  document.title = fullName(m) + " 명함";
  renderCard(m, document.querySelector("#mineView .card-render"), true);
  drawQr(m);
  $("qrMode").onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    qrMode = b.dataset.m;
    document.querySelectorAll("#qrMode button").forEach(x => x.classList.toggle("on", x === b));
    drawQr(m);
  };
  show(["mineView"]);
}
function showInfo() {
  const m = read(KEY, null);
  show(["infoPane"]);
  $("infoMsg").textContent = m && m.lastName ? "" : "아직 내 명함이 없습니다. '정보 수정'에서 만들어 주세요.";
  $("mineEdit").onclick = () => showMineForm(m && m.lastName ? m : null, "info");
  $("mineVcf").onclick = () => { if (m && m.lastName) download(fullName(m) + ".vcf", buildVcard(m)); };
  $("share").onclick = async () => {
    if (!m || !m.lastName) return;
    const url = cardLink(m);
    if (navigator.share) { try { await navigator.share({ title: fullName(m) + " 명함", url }); } catch (e) {} }
    else { try { await navigator.clipboard.writeText(url); $("infoMsg").textContent = "링크를 복사했습니다."; } catch (e) { prompt("링크를 복사하세요", url); } }
  };
}
$("mineForm").onsubmit = e => { e.preventDefault(); const m = getForm("mine"); if (write(KEY, m)) tab("mine"); };
$("mineCancel").onclick = () => tab(formFrom);

/* ---------- 학습(교정 사전) ---------- */
// fixes: [{f:필드, from:OCR가 읽은 값, to:사용자가 고친 값, n:횟수, t:시각}]
const norm = s => String(s || "").replace(/\s+/g, " ").trim();
function applyFixes(card) {
  const fixes = read(FIX, []), out = { ...card }, fixed = new Set();
  for (const x of fixes) {
    if (norm(out[x.f]) === x.from) { out[x.f] = x.to; fixed.add(x.f); }
  }
  return { card: out, fixed };
}
function learn(raw, final) {
  const fixes = read(FIX, []);
  for (const f of FIELDS) {
    const a = norm(raw[f]), b = norm(final[f]);
    if (!a || !b || a === b) continue;           // 새로 채우거나 지운 것은 교정 사례가 아님
    const hit = fixes.find(x => x.f === f && x.from === a);
    if (hit) { hit.to = b; hit.n++; hit.t = Date.now(); }
    else fixes.push({ f, from: a, to: b, n: 1, t: Date.now() });
  }
  fixes.sort((x, y) => y.t - x.t);
  write(FIX, fixes.slice(0, 300));
}
const hints = () => read(FIX, []).slice(0, 20).map(({ f, from, to }) => ({ field: f, from, to }));

/* ---------- 스캔 / OCR ---------- */
let rawOcr = null, editingId = null, photo = null;
const ocrUrl = () => localStorage.getItem(OCRKEY) || DEFAULT_OCR_URL;
$("setOcr").onclick = e => {
  e.preventDefault();
  const v = prompt("OCR Worker 주소 (예: https://namecard-ocr.xxx.workers.dev)", ocrUrl());
  if (v !== null) localStorage.setItem(OCRKEY, v.trim());
};
function msg(t, err) { $("scanMsg").textContent = t; $("scanMsg").className = "msg" + (err ? " err" : ""); }
function openScanForm(m, id) {
  editingId = id || null;
  setForm("scan", m);
  $("scanDel").classList.toggle("hidden", !id);
  $("scanForm").classList.remove("hidden");
}
$("pick").onclick = () => $("file").click();
$("manual").onclick = () => { rawOcr = null; photo = null; $("preview").classList.add("hidden"); msg(""); openScanForm(blank(), null); };

function shrink(file, max = 1600) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => rej(new Error("이미지를 열 수 없습니다."));
    img.src = URL.createObjectURL(file);
  });
}
$("file").onchange = async () => {
  const f = $("file").files[0]; $("file").value = "";
  if (!f) return;
  $("scanForm").classList.add("hidden");
  try {
    const url = ocrUrl();
    if (!url) { msg("먼저 아래 'OCR 서버 주소 설정'에서 Worker 주소를 입력해 주세요. (직접 입력은 바로 가능합니다)", true); return; }
    msg("명함을 읽는 중…");
    const data = await shrink(f);
    $("preview").src = data; $("preview").classList.remove("hidden");
    const r = await fetch(url, { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ image: data.split(",")[1], mediaType: "image/jpeg", hints: hints() }) });
    if (!r.ok) throw new Error("OCR 서버 오류 (" + r.status + ")");
    const j = await r.json();
    const card = blank(); FIELDS.forEach(k => card[k] = norm(j[k]));
    rawOcr = { ...card };
    const { card: fixedCard, fixed } = applyFixes(card);
    openScanForm(fixedCard, null);
    fixed.forEach(k => $("scan-" + k).classList.add("fixed"));
    msg(fixed.size ? `읽기 완료. 파란 테두리 ${fixed.size}곳은 이전에 고친 내용으로 자동 교정했습니다. 내용을 확인해 주세요.` : "읽기 완료. 틀린 곳을 고친 뒤 저장해 주세요.");
  } catch (e) { msg(e.message || "읽기에 실패했습니다.", true); }
};
$("scanForm").onsubmit = e => {
  e.preventDefault();
  const m = getForm("scan");
  if (!m.lastName && !m.firstName) { msg("이름을 입력해 주세요.", true); return; }
  if (rawOcr) learn(rawOcr, m);
  const lib = read(LIB, []);
  if (editingId) { const i = lib.findIndex(x => x.id === editingId); if (i >= 0) lib[i] = { ...m, id: editingId, t: lib[i].t }; }
  else lib.unshift({ ...m, id: Date.now().toString(36), t: Date.now() });
  if (!write(LIB, lib)) return;
  rawOcr = null; $("preview").classList.add("hidden"); $("scanForm").classList.add("hidden");
  msg("보관함에 저장했습니다.");
};
$("scanVcf").onclick = () => { const m = getForm("scan"); if (m.lastName || m.firstName) download(fullName(m) + ".vcf", buildVcard(m)); };
$("scanDel").onclick = () => {
  if (!editingId || !confirm("이 명함을 삭제할까요?")) return;
  write(LIB, read(LIB, []).filter(x => x.id !== editingId));
  tab("lib");
};

/* ---------- 보관함 ---------- */
function renderLib() {
  const q = $("q").value.trim().toLowerCase();
  const items = read(LIB, []).filter(m => !q || FIELDS.some(f => (m[f] || "").toLowerCase().includes(q)));
  $("list").innerHTML = items.length ? items.map(m =>
    `<div class="item" data-id="${m.id}"><b>${text(fullName(m))}</b> <span style="color:var(--sub);font-size:13px">${text(m.title)}</span>` +
    `<small>${text([m.org, m.phone || m.tel].filter(Boolean).join(" · "))}</small></div>`).join("")
    : `<div class="msg">${q ? "검색 결과가 없습니다." : "아직 받은 명함이 없습니다. '스캔' 탭에서 추가해 보세요."}</div>`;
}
$("q").oninput = renderLib;
$("list").onclick = e => {
  const it = e.target.closest(".item"); if (!it) return;
  const m = read(LIB, []).find(x => x.id === it.dataset.id); if (!m) return;
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === "scan"));
  show(["scanPane"]); rawOcr = null; $("preview").classList.add("hidden"); msg("");
  openScanForm(m, m.id);
};
$("exportAll").onclick = () => {
  const lib = read(LIB, []);
  if (!lib.length) { $("libMsg").textContent = "내보낼 명함이 없습니다."; return; }
  download("namecards.vcf", lib.map(buildVcard).join("\r\n"));
};

/* ---------- 시작 ---------- */
// 예전 방식의 공유 링크(#c=)는 받는 사람 전용 페이지로 넘깁니다.
if (location.hash.startsWith("#c=")) location.replace(new URL("c.html", location.href).href + location.hash);
else tab("mine");
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
